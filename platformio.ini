; PlatformIO project for the Teensy 4.1 Intercom firmware.
;
; Library versions are pinned so a build today matches a build a year from
; now. Building with the Arduino IDE still works -- see docs/quickstart.md.
;
;   pio run              build
;   pio run -t upload    build and flash a connected Teensy

[platformio]
src_dir = firmware/TeensyIntercom

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

lib_deps =
    ssilverman/QNEthernet@0.36.0
    knolleary/PubSubClient@2.8

build_flags =
    -Wall
    -Wextra
