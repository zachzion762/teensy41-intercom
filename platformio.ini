; PlatformIO project for the Teensy 4.1 Intercom firmware.
;
; Library versions are pinned so a build today matches a build a year from
; now. Building with the Arduino IDE still works -- see docs/quickstart.md.
;
;   pio run              build
;   pio run -t upload    build and flash a connected Teensy

[platformio]
src_dir = firmware/TeensyIntercom

[env:teensy41]
platform  = teensy
board     = teensy41
framework = arduino

; The configuration console runs at 115200; without this, `pio device monitor`
; falls back to its 9600 default and shows garbage.
monitor_speed = 115200

lib_deps =
    ssilverman/QNEthernet@0.36.0
    knolleary/PubSubClient@2.8

; Scoped to this project's sources only -- build_flags would also apply these
; to the Teensy core and the pinned libraries, burying our warnings in theirs.
build_src_flags =
    -Wall
    -Wextra
