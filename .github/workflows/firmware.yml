name: firmware

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  host-tests:
    name: Host tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and run host tests
        run: make -C test/host

  build:
    name: Build firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run

      - name: Stage artifacts
        run: |
          mkdir -p dist
          cp .pio/build/teensy41/firmware.hex dist/teensy-intercom.hex
          cp .pio/build/teensy41/firmware.elf dist/teensy-intercom.elf

      - uses: actions/upload-artifact@v4
        with:
          name: teensy-intercom-firmware
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [host-tests, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: teensy-intercom-firmware
          path: dist

      - name: Attach firmware to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/teensy-intercom.hex
            dist/teensy-intercom.elf
          body: |
            Prebuilt firmware for Teensy 4.1.

            **No toolchain required.** Download `teensy-intercom.hex`, open it
            with the [Teensy Loader](https://www.pjrc.com/teensy/loader.html),
            press the button on the board, then configure the broker over USB
            serial or the built-in web page.

            See [docs/quickstart.md](docs/quickstart.md) for the walkthrough.
